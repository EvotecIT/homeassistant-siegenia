name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            requirements: requirements_test_minimum.txt
          - python-version: "3.12"
            requirements: requirements_test.txt
          - python-version: "3.13"
            requirements: requirements_test.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}
      - name: Run tests
        run: |
          pytest

  tests-latest-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install current stable Home Assistant test stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test_latest.txt
      - name: Run tests against current stable Home Assistant
        run: |
          pytest

      - name: Strict typing against current stable HA
        run: python -m mypy --strict custom_components/siegenia
