[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistant-siegenia"
version = "1.1.16"
description = "HACS-ready Siegenia integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Community Maintainers" }]
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "pytest-homeassistant-custom-component>=0.13.346",
  "mypy==2.4.0"
]

[tool.setuptools.packages.find]
include = ["custom_components*", "siegenia_client*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"siegenia_client" = ["*.pyi", "py.typed"]
"custom_components.siegenia" = ["py.typed", "manifest.json", "icons.json", "translations/*.json", "services.yaml", "brand/*.png", "icons/*.svg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["custom_components/siegenia"]
